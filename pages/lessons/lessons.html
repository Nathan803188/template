<!DOCTYPE html>
<html>
<head>
    <title id="tab-title">Learn Calculus</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/fontawesome.css"/>
    <link rel="stylesheet" href="../../css/otherpages.css"/>
    <link id="tab-icon" rel="icon" type="image/x-icon" href="https://login.classlink.com/favicon.ico">
    <style>
        /* Existing Styles */
        #gamesgrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(7.5vw, 1fr));
            column-gap: 0.5vw;
            row-gap: 2vh;
            margin-bottom: 0;
        }
        img {
            width: 7.6vw;
            height: 7.6vw;
            border-radius: 10%;
            object-fit: cover;
            margin-bottom: 1vh;
        }
        button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 7.6vw;
            height: auto;
            font-size: 60%;
            padding: 0 0 0.5vw 0;
            border-radius: 15px;
            cursor: pointer;
        }
        #gamesearchform {
            display: flex;
            justify-content: center;
            margin-bottom: 4vh;
        }
        #gamesearchinput {
            background: none;
            color: #5EFD28;
            font-family: inherit;
            padding: 0px 17px;
            height: 48px;
            outline: 2px solid #00FF00;
            border-radius: 50px;
            width: 350px;
            margin-top: 5px;
        }

        /* Settings UI Styles */
        #settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px;
            z-index: 100;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            width: auto;
            height: auto;
        }
        #settings-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 2px solid #0f0;
            padding: 20px;
            z-index: 101;
            color: white;
            border-radius: 10px;
            width: 300px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
        }
        .settings-section { margin-bottom: 15px; }
        .settings-section input { width: 90%; margin-top: 5px; background: #222; border: 1px solid #0f0; color: white; padding: 5px; }
        .settings-section button { width: 100%; margin-top: 10px; flex-direction: row; justify-content: center; height: 30px;}
    </style>
</head>
<body>

    <button id="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>

    <div id="modal-bg" class="modal-overlay" onclick="toggleSettings()"></div>
    <div id="settings-modal">
        <h3>Settings</h3>
        <hr>
        <div class="settings-section">
            <label>Panic URL (Key: ` )</label>
            <input type="text" id="panic-input" placeholder="https://google.com">
        </div>
        <div class="settings-section">
            <p>Presets:</p>
            <button onclick="applyCloak('Google', 'https://google.com/favicon.ico')">Google</button>
            <button onclick="applyCloak('Classes', 'https://ssl.gstatic.com/classroom/favicon.png')">Classroom</button>
        </div>
        <div class="settings-section">
            <label>Custom Title</label>
            <input type="text" id="custom-title" placeholder="New Title">
            <label>Custom Favicon</label>
            <input type="text" id="custom-icon" placeholder="Icon URL">
            <button onclick="applyCustom()">Apply Custom</button>
        </div>
        <button onclick="toggleSettings()" style="background: #444; color: white;">Close</button>
    </div>

    <form id="gamesearchform" class="flex-center" onsubmit="return false;">
        <input id="gamesearchinput" autocomplete="off" type="text" placeholder="Search 91 games" />
    </form>

    <div id="gamesgrid">
        <button onclick="openGame('emujs/emulator.html')"> <img src="img/emujs.webp" draggable="false">Emulator Games</button>
        <button onclick="openGame('2048/2048.html')"> <img src="img/1.webp" draggable="false">2048</button>
        <p id="no-results">No results...</p>
    </div>

    <script>
        // --- 1. PERSISTENCE & CLOAKING ---
        function applyCloak(title, icon) {
            document.title = title;
            document.getElementById('tab-icon').href = icon;
            localStorage.setItem('cloakTitle', title);
            localStorage.setItem('cloakIcon', icon);
        }

        function applyCustom() {
            const t = document.getElementById('custom-title').value;
            const i = document.getElementById('custom-icon').value;
            if(t && i) applyCloak(t, i);
        }

        // Load saved cloak on startup
        window.onload = () => {
            const t = localStorage.getItem('cloakTitle');
            const i = localStorage.getItem('cloakIcon');
            if(t && i) applyCloak(t, i);
            
            const p = localStorage.getItem('panicUrl');
            if(p) document.getElementById('panic-input').value = p;
        };

        // --- 2. PANIC KEY ---
        window.addEventListener('keydown', (e) => {
            if (e.key === "`") {
                const url = document.getElementById('panic-input').value || "https://google.com";
                window.location.href = url;
            }
        });

        // --- 3. SETTINGS TOGGLE ---
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            const bg = document.getElementById('modal-bg');
            const isVisible = modal.style.display === 'block';
            modal.style.display = isVisible ? 'none' : 'block';
            bg.style.display = isVisible ? 'none' : 'block';
            
            // Save panic URL whenever closing
            localStorage.setItem('panicUrl', document.getElementById('panic-input').value);
        }

        // --- 4. CLOAKED ABOUT:BLANK OPENER ---
        function openGame(url) {
            const win = window.open();
            if (!win) {
                alert("Please allow popups!");
                return;
            }

            // Get current cloak info
            const currentTitle = document.title;
            const currentIcon = document.getElementById('tab-icon').href;

            win.document.open();
            // Injecting the title and favicon into the blank tab
            win.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${currentTitle}</title>
                    <link rel="icon" type="image/x-icon" href="${currentIcon}">
                    <style>
                        *{margin:0;padding:0;overflow:hidden;}
                        html,body{width:100%;height:100%;background:black;}
                        iframe{border:none;width:100%;height:100%;display:block;}
                    </style>
                </head>
                <body>
                    <iframe src="${window.location.origin + '/' + url}"></iframe>
                </body>
                </html>
            `);
            win.document.close();
        }

        // --- 5. SEARCH LOGIC ---
        const searchInput = document.getElementById('gamesearchinput');
        const grid = document.getElementById('gamesgrid');
        const noResults = document.getElementById('no-results');
        
        searchInput.addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();
            const buttons = grid.querySelectorAll('button:not(#settings-btn)');
            let visibleCount = 0;
            buttons.forEach(btn => {
                const name = btn.textContent.trim().toLowerCase();
                const matches = !query || name.includes(query);
                btn.style.display = matches ? '' : 'none';
                if (matches) visibleCount++;
            });
            noResults.style.display = visibleCount == 0 ? 'block' : 'none';
        });
    </script>
</body>
</html>
